[package]
name = "gravlume"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A scientific black-hole visualization instrument"
publish.workspace = true

[workspace]
members = [
  "crates/*",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.dependencies]
approx = { version = "0.5.1", default-features = false, features = ["std"] }
bytemuck = { version = "1.25", features = ["derive"] }
block2 = { version = "0.6", default-features = false, features = ["alloc"] }
criterion = { version = "0.8.2", default-features = false, features = [
  "cargo_bench_support",
] }
egui = "0.36"
egui-wgpu = { version = "0.36", default-features = false }
egui-winit = { version = "0.36", default-features = false }
glam = { version = "0.33", default-features = false, features = ["f64", "std"] }
gravlume-desktop = { path = "crates/gravlume-desktop" }
gravlume-domain = { path = "crates/gravlume-domain" }
gravlume-native-display = { path = "crates/gravlume-native-display" }
gravlume-reference = { path = "crates/gravlume-reference" }
gravlume-render = { path = "crates/gravlume-render" }
num-traits = "0.2"
objc2 = { version = "0.6", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }
objc2-foundation = { version = "0.3", default-features = false }
pollster = "1.0"
proptest = { version = "1.11", default-features = false, features = ["std"] }
raw-window-handle = { version = "0.6", features = ["std"] }
rayon = "1.12"
serde = { version = "1.0", default-features = false, features = [
  "derive",
  "std",
] }
thiserror = "2.0"
toml = { version = "1.1", default-features = false, features = [
  "parse",
  "serde",
  "std",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "env-filter",
  "fmt",
] }
wgpu = { version = "30.0", default-features = false, features = [
  "parking_lot",
  "std",
  "wgsl",
] }
wayland-client = { version = "0.31", default-features = false }
wayland-protocols = { version = "0.32", default-features = false }
windows = "0.62"
windows-core = "0.62"
windows-future = "0.3"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

[dependencies]
gravlume-desktop.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[package]
name = "gravlume-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bytemuck.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
gravlume-domain = { path = "../gravlume-domain" }
pollster.workspace = true
thiserror.workspace = true
tracing.workspace = true
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
gravlume-reference = { path = "../gravlume-reference" }
naga = { version = "30.0", features = ["wgsl-in"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[lints]
workspace = true
